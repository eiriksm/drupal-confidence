name: Test
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  composer-validate:
    name: Composer validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Composer validate
        run: composer ci:validate

  composer-install:
    name: Composer install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies
        run: composer --verbose install

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies
        run: composer --verbose install

      - name: Run PHP_CodeSniffer
        run: composer phpcs

  phpstan:
    name: Static analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Install dependencies
        run: composer --verbose install

      - name: Run PHPStan
        run: composer phpstan

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version:
          - "8.3"
    env:
      DRUPAL_DATABASE_URL: mysql://root:root@127.0.0.1/drupal
      DRUPAL_HASH_SALT: not-a-secret-only-used-in-ci
      SIMPLETEST_DB: mysql://root:root@127.0.0.1/drupal
      SIMPLETEST_BASE_URL: http://127.0.0.1:8888
      DTT_BASE_URL: http://127.0.0.1:8888
      MINK_DRIVER_ARGS_WEBDRIVER: '["chrome", {"browserName": "chrome", "goog:chromeOptions": {"args": ["--headless=new", "--disable-gpu", "--no-sandbox", "--disable-dev-shm-usage"]}}, "http://127.0.0.1:4444"]'
      DTT_MINK_DRIVER_ARGS: '["chrome", {"browserName": "chrome", "goog:chromeOptions": {"args": ["--headless=new", "--disable-gpu", "--no-sandbox", "--disable-dev-shm-usage"]}}, "http://127.0.0.1:4444"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, pdo_mysql

      - name: Start MySQL
        run: sudo systemctl start mysql.service

      - name: Install dependencies
        run: composer --verbose install

      - name: Install site
        run: composer site-install

      - name: Start web server and ChromeDriver
        run: |
          cd web && PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8888 .ht.router.php > /tmp/php-server.log 2>&1 &
          nohup "$CHROMEWEBDRIVER/chromedriver" --port=4444 > /tmp/chromedriver.log 2>&1 &

      - name: Run PHPUnit
        run: composer phpunit
